<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workbench Refurbished</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<header class="topbar">
  <div class="logo">Work<b>bench</b><small>Refurbished</small></div>
  <div class="top-actions">
    <input id="search" class="input search" placeholder="Search devices…" oninput="state.search=this.value;render()">
    <button class="btn" onclick="addManualNote()">+ Note</button>
    <button class="btn" onclick="openSettings()">Settings</button>
    <button class="btn" onclick="toggleTheme()">Theme</button>
    <button class="btn" onclick="exportData()">Export</button>
    <button class="btn" onclick="document.getElementById('import-file').click()">Import</button>
    <button class="btn primary" onclick="openDevice()">+ Device</button>
  </div>
</header>
<main class="page">
  <div id="app"></div>
</main>
<input id="import-file" type="file" accept=".json,application/json" hidden onchange="importData(event)">
<div id="overlay" class="overlay" style="display:none"></div>
<div id="toast" class="toast" style="display:none"></div>
<script src="index.js"></script>
</body>
</html>
